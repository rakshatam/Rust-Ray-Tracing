[package]
name = "sponza-rt"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.18", features = ["derive"] }
env_logger = "0.11"
glam = { version = "0.29", features = ["bytemuck"] }
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
pollster = "0.3"
ureq = "2.10"
wgpu = "22.1.0"
winit = "0.29.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"